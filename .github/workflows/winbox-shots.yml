name: Winbox 4 — настоящие скриншоты окон

# Поднимает настоящий RouterOS CHR в QEMU, запускает настоящий Winbox 4 (Linux)
# под Xvfb, подключается к роутеру и снимает окна по списку разделов.
# Результат (PNG, JPEG 900px и манифест) коммитится в ветку в docs/shots/.
#
# Режимы (вход mode):
#   capture   — снять окна по .github/scripts/shot-list.txt (по умолчанию)
#   calibrate — пройти по дереву меню с шагом 23 px и записать, какое окно
#               открывается от каждого клика (нужно, чтобы точно задать y)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'capture или calibrate'
        required: false
        default: 'capture'
  push:
    paths:
      - 'ci/shots-mode.txt'
      - 'ci/winbox-shots.trigger'
      - '.github/workflows/winbox-shots.yml'
      - '.github/scripts/winbox-capture.sh'
      - '.github/scripts/shot-list.txt'
      - '.github/scripts/guest-shot.py'

permissions:
  contents: write

jobs:
  shots:
    name: CHR + Winbox 4 + снимки
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      DISPLAY: ':99'
      CHR_VER: '7.24.6'
      WINBOX_URL: 'https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Linux.zip'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Режим съёмки
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ -f ci/shots-mode.txt ]; then
            echo "mode=$(head -1 ci/shots-mode.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "mode=capture" >> "$GITHUB_OUTPUT"
          fi

      - name: Зависимости (QEMU, Xvfb, Qt, xdotool, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 qemu-utils xvfb x11-utils xdotool imagemagick unzip \
            netcat-openbsd libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxi6 libsm6 libice6 libfontconfig1 fonts-dejavu-core

      - name: Скачать CHR и Winbox 4
        run: |
          set -euxo pipefail
          mkdir -p /tmp/wb docs/shots
          rm -f docs/shots/*.png docs/shots/*.txt docs/shots/probe-*.jpg || true
          curl -fL --retry 3 -o /tmp/wb/chr.zip "https://download.mikrotik.com/routeros/${CHR_VER}/chr-${CHR_VER}.img.zip"
          curl -fL --retry 3 -o /tmp/wb/winbox.zip "$WINBOX_URL"
          cd /tmp/wb
          unzip -o chr.zip
          unzip -o winbox.zip -d winbox
          ls -l
          qemu-img convert -f raw -O qcow2 "chr-${CHR_VER}.img" chr.qcow2
          qemu-img info chr.qcow2 | tee qemu-img-info.txt

      - name: Запустить CHR в QEMU
        run: |
          set -euxo pipefail
          cd /tmp/wb
          qemu-system-x86_64 -m 1536 -smp 2 -machine pc -cpu max \
            -accel tcg,thread=multi \
            -drive file=chr.qcow2,format=qcow2,if=ide,index=0 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:8291-:8291 \
            -device e1000,netdev=n0 \
            -serial file:/tmp/wb/serial.log \
            -display none -monitor unix:/tmp/wb/mon.sock,server,nowait \
            -daemonize -pidfile /tmp/wb/qemu.pid
          sleep 5
          ps -p "$(cat /tmp/wb/qemu.pid)" -o pid,etime,cmd || true

      - name: Дождаться, когда RouterOS загрузится
        run: |
          set -ux
          cd "$GITHUB_WORKSPACE"
          ready=0
          for i in $(seq 1 40); do
            sleep 20
            t=$((i*20))
            # порт 8291 у QEMU открывается сразу, поэтому ждём консоль RouterOS в serial.log
            if grep -qiE 'login:|RouterOS' /tmp/wb/serial.log 2>/dev/null; then
              ready=1; echo "консоль RouterOS в serial.log на ${t}c" >> docs/shots/report.txt; break
            fi
            echo "t=${t}c serial: $(tail -c 200 /tmp/wb/serial.log 2>/dev/null | tr -d '\r' | tail -1)" >> docs/shots/report.txt
          done
          echo "ready=$ready" >> docs/shots/report.txt
          sleep 30

      - name: Запустить Xvfb и Winbox 4
        run: |
          set -ux
          cd "$GITHUB_WORKSPACE"
          if ! pgrep -f 'Xvfb :99' >/dev/null; then
            Xvfb :99 -screen 0 1600x1100x24 -nolisten tcp > /tmp/wb/xvfb.log 2>&1 &
            sleep 3
          fi
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1
          BIN=$(ls /tmp/wb/winbox/WinBox 2>/dev/null || find /tmp/wb/winbox -maxdepth 2 -name 'WinBox*' -type f -perm -u+x | head -1)
          echo "BIN=$BIN" >> docs/shots/report.txt
          chmod +x "$BIN" 2>/dev/null
          for k in 1 2 3; do
            if ! pgrep -f 'WinBox' >/dev/null; then
              ( cd /tmp/wb/winbox && nohup "$BIN" >> /tmp/wb/winbox.log 2>&1 & )
              sleep 15
            fi
            if pgrep -f 'WinBox' >/dev/null; then
              echo "Winbox запущен (попытка $k)" >> docs/shots/report.txt; break
            fi
            echo "Winbox не поднялся (попытка $k), лог:" >> docs/shots/report.txt
            tail -20 /tmp/wb/winbox.log >> docs/shots/report.txt 2>/dev/null
            sleep 5
          done
          ps aux | grep -E 'WinBox|Xvfb' | grep -v grep >> docs/shots/report.txt || true

      - name: Снять окна (настоящий Winbox 4)
        run: |
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/winbox-capture.sh "${{ steps.mode.outputs.mode }}" || true
          echo "=== окна X ===" >> docs/shots/report.txt
          for w in $(xdotool search --name '.' 2>/dev/null); do
            xdotool getwindowname "$w" 2>/dev/null || true
          done | sed '/^$/d' | sort -u >> docs/shots/report.txt
          tail -40 /tmp/wb/winbox.log >> docs/shots/report.txt || true

      - name: Снимки в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbox-shots
          path: |
            docs/shots/*.png
            docs/shots/jpg/*.jpg
            docs/shots/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Отчёт и скриншоты в ветку
        if: always()
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs/shots/jpg
          { echo "=== время ==="; date -u; echo "=== процессы ==="; ps aux | grep -Ei 'qemu|winbox|xvfb' | grep -v grep || true;
            echo "=== файлы ==="; ls -l docs/shots docs/shots/jpg; } >> docs/shots/report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/shots
          git commit --allow-empty -m "CI: настоящие скриншоты Winbox 4 [skip ci]" || echo "нечего коммитить"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && \
               git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            echo "попытка $i не удалась, ждём"; sleep 10
          done
          [ "$ok" = 1 ] && echo "снимки в ветке" || echo "push не удался после 4 попыток"
