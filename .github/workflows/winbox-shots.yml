name: Winbox 4 — настоящие скриншоты окон

# Поднимает настоящий RouterOS CHR в QEMU, запускает настоящий Winbox 4 (Linux)
# под Xvfb, подключается к роутеру и снимает окна по списку разделов.
# Результат (PNG, JPEG 900px и манифест) коммитится в ветку в docs/shots/.
#
# Режимы (вход mode):
#   scene     — настроить роутер по lab-setup.rsc (те же данные, что в
#               инструкциях), снять окна стенда, затем добрать остальные
#   nav       — открыть окна по названиям пунктов меню и снять недостающие
#               кадры (уже снятые пропускаются, force=true переснимает всё)
#   capture   — старый режим съёмки по Y-координатам из shot-list.txt
#   calibrate — пройти по дереву меню с шагом 23 px и записать, какое окно
#               открывается от каждого клика (нужно, чтобы точно задать y)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scene, nav, capture или calibrate'
        required: false
        default: 'scene'
      force:
        description: 'Переснять все окна, а только недостающие'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'ci/shots-mode.txt'
      - 'ci/winbox-shots.trigger'
      - '.github/workflows/winbox-shots.yml'
      - '.github/scripts/winbox-capture.sh'
      - '.github/scripts/winbox-nav.py'
      - '.github/scripts/shot-list.txt'
      - '.github/scripts/guest-shot.py'
      - '.github/scripts/scene-list.txt'
      - '.github/scripts/lab-setup.rsc'
      - '.github/scripts/ros-api.py'

permissions:
  contents: write

concurrency:
  group: winbox-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: CHR + Winbox 4 + снимки
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      DISPLAY: ':99'
      CHR_VER: '7.24.6'
      WINBOX_URL: 'https://download.mikrotik.com/routeros/winbox/4.4/WinBox_Linux.zip'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Режим съёмки
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ -f ci/shots-mode.txt ]; then
            echo "mode=$(head -1 ci/shots-mode.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "mode=capture" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверить скрипт съёмки (нет необъявленных имён)
        run: |
          python3 - <<'PY'
          import ast, builtins
          src = open('.github/scripts/winbox-nav.py', encoding='utf-8').read()
          tree = ast.parse(src)
          defined = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          local = {n.arg for n in ast.walk(tree) if isinstance(n, ast.arg)}
          local |= {n.id for n in ast.walk(tree)
                    if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Store)}
          # импорты и «except … as exc» — тоже объявления
          for node in ast.walk(tree):
              if isinstance(node, (ast.Import, ast.ImportFrom)):
                  for al in node.names:
                      local.add((al.asname or al.name).split('.')[0])
              if isinstance(node, ast.ExceptHandler) and node.name:
                  local.add(node.name)
          used = {n.id for n in ast.walk(tree)
                  if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)}
          bad = sorted(u for u in used
                       if u not in defined and not hasattr(builtins, u) and u not in local)
          if bad:
              raise SystemExit('не объявлены: ' + ', '.join(bad))
          print('скрипт цел, все имена объявлены')
          PY

      - name: Зависимости (QEMU, Xvfb, Qt, xdotool, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-system-x86 qemu-utils xvfb x11-utils xdotool imagemagick unzip \
            netcat-openbsd tesseract-ocr tesseract-ocr-rus libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxi6 libsm6 libice6 libfontconfig1 fonts-dejavu-core \
            openbox

      - name: Скачать CHR и Winbox 4
        run: |
          set -euxo pipefail
          mkdir -p /tmp/wb docs/shots
          rm -f docs/shots/*.png docs/shots/probe-*.jpg || true
          curl -fL --retry 3 -o /tmp/wb/chr.zip "https://download.mikrotik.com/routeros/${CHR_VER}/chr-${CHR_VER}.img.zip"
          curl -fL --retry 3 -o /tmp/wb/winbox.zip "$WINBOX_URL"
          cd /tmp/wb
          unzip -o chr.zip
          unzip -o winbox.zip -d winbox
          ls -l
          qemu-img convert -f raw -O qcow2 "chr-${CHR_VER}.img" chr.qcow2
          qemu-img info chr.qcow2 | tee qemu-img-info.txt

      - name: Самопроверка клиента RouterOS API
        run: python3 .github/scripts/ros-api.py --selftest

      - name: Запустить CHR в QEMU
        run: |
          set -euxo pipefail
          cd /tmp/wb
          qemu-system-x86_64 -m 1536 -smp 2 -machine pc -cpu max \
            -accel tcg,thread=multi \
            -drive file=chr.qcow2,format=qcow2,if=ide,index=0 \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:8291-:8291,hostfwd=tcp:127.0.0.1:8728-:8728 \
            -device e1000,netdev=n0 \
            -netdev user,id=n1 -device e1000,netdev=n1 \
            -netdev user,id=n2 -device e1000,netdev=n2 \
            -netdev user,id=n3 -device e1000,netdev=n3 \
            -netdev user,id=n4 -device e1000,netdev=n4 \
            -serial file:/tmp/wb/serial.log \
            -display none -monitor unix:/tmp/wb/mon.sock,server,nowait \
            -daemonize -pidfile /tmp/wb/qemu.pid
          sleep 5
          ps -p "$(cat /tmp/wb/qemu.pid)" -o pid,etime,cmd || true

      - name: Дать CHR время загрузиться
        run: |
          set -ux
          cd "$GITHUB_WORKSPACE"
          # CHR под TCG грузится 8-12 минут; точный момент входа проверяет
          # winbox-nav.py — он повторяет попытку, пока не появится дерево меню.
          sleep 300
          echo "прошло 5 минут после старта QEMU" >> docs/shots/report.txt
          tail -c 300 /tmp/wb/serial.log >> docs/shots/report.txt 2>/dev/null || true

      - name: Запустить Xvfb и Winbox 4
        run: |
          set -ux
          cd "$GITHUB_WORKSPACE"
          if ! pgrep -f 'Xvfb :99' >/dev/null; then
            Xvfb :99 -screen 0 1600x1100x24 -nolisten tcp > /tmp/wb/xvfb.log 2>&1 &
            sleep 3
          fi
          # Оконный менеджер: без него Qt не даёт менять размер окна, и вкладки
          # Winbox («Interface List», «Registration», «WPS») уезжают за край.
          DISPLAY=:99 openbox --sm-disable > /tmp/wb/openbox.log 2>&1 &
          sleep 2
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software QT_OPENGL=software LIBGL_ALWAYS_SOFTWARE=1
          BIN=$(ls /tmp/wb/winbox/WinBox 2>/dev/null || find /tmp/wb/winbox -maxdepth 2 -name 'WinBox*' -type f -perm -u+x | head -1)
          echo "BIN=$BIN" >> docs/shots/report.txt
          chmod +x "$BIN" 2>/dev/null
          for k in 1 2 3; do
            if ! pgrep -f 'WinBox' >/dev/null; then
              ( cd /tmp/wb/winbox && nohup "$BIN" >> /tmp/wb/winbox.log 2>&1 & )
              sleep 15
            fi
            if pgrep -f 'WinBox' >/dev/null; then
              echo "Winbox запущен (попытка $k)" >> docs/shots/report.txt; break
            fi
            echo "Winbox не поднялся (попытка $k), лог:" >> docs/shots/report.txt
            tail -20 /tmp/wb/winbox.log >> docs/shots/report.txt 2>/dev/null
            sleep 5
          done
          ps aux | grep -E 'WinBox|Xvfb' | grep -v grep >> docs/shots/report.txt || true

      - name: Снять окна (настоящий Winbox 4)
        if: steps.mode.outputs.mode != 'nav' && steps.mode.outputs.mode != 'scene'
        run: |
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/winbox-capture.sh "${{ steps.mode.outputs.mode }}"
          echo "=== окна X ===" >> docs/shots/report.txt
          for w in $(xdotool search --name '.' 2>/dev/null); do
            xdotool getwindowname "$w" 2>/dev/null || true
          done | sed '/^$/d' | sort -u >> docs/shots/report.txt
          tail -40 /tmp/wb/winbox.log >> docs/shots/report.txt || true

      - name: Настроить учебный стенд (данные из инструкций)
        if: steps.mode.outputs.mode == 'scene'
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          # Без этого шага снимки показывают пустой CHR и не совпадают с
          # текстом статей. Строки применяются по одной, отказ виден в логе.
          python3 .github/scripts/ros-api.py 127.0.0.1 8728 admin "" \
            .github/scripts/lab-setup.rsc 2>&1 | tee -a docs/shots/report.txt

      - name: Снять окна настроенного стенда
        if: steps.mode.outputs.mode == 'scene'
        env:
          NAV_SCENE: '1'
          NAV_BUDGET: '2700'
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/winbox-nav.py docs/shots .github/scripts/scene-list.txt 2>&1 | tee -a docs/shots/report.txt

      # Кадры стенда публикуются сразу, не дожидаясь добора остальных окон:
      # иначе таймаут или отмена прогона уносят с собой всю съёмку.
      - name: Опубликовать кадры стенда
        if: steps.mode.outputs.mode == 'scene'
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/shots
          git commit -m "CI: снимки настроенного стенда Winbox 4 [skip ci]" || { echo "нечего коммитить"; exit 0; }
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && \
               git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            echo "попытка $i не удалась"; sleep 10
          done
          echo "push не удался" >&2
          exit 1

      - name: Снять окна по названиям пунктов меню
        if: steps.mode.outputs.mode == 'nav' || steps.mode.outputs.mode == 'scene'
        env:
          FORCE: ${{ (github.event.inputs.force == true || github.event.inputs.force == 'true') && '1' || '0' }}
          NAV_BUDGET: ${{ steps.mode.outputs.mode == 'scene' && '1500' || '5400' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          # tee: вывод и трейсбеки скрипта тоже попадают в отчёт в ветке.
          # Без «|| true»: NameError/трейсбек должен валить шаг, а не красить
          # job в зелёный. Отчёт всё равно уедет в ветку шагом ниже (always()).
          python3 .github/scripts/winbox-nav.py docs/shots .github/scripts/shot-list.txt 2>&1 | tee -a docs/shots/report.txt

      - name: Снимки в артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbox-shots
          path: |
            docs/shots/*.png
            docs/shots/jpg/*.jpg
            docs/shots/*.txt
            docs/shots/ocr/*.txt
            docs/shots/verified.json
          if-no-files-found: warn
          retention-days: 14

      - name: Отчёт и скриншоты в ветку
        if: always()
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs/shots/jpg
          { echo "=== время ==="; date -u; echo "=== процессы ==="; ps aux | grep -Ei 'qemu|winbox|xvfb' | grep -v grep || true;
            echo "=== файлы ==="; ls -l docs/shots docs/shots/jpg; } >> docs/shots/report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/shots
          git commit --allow-empty -m "CI: настоящие скриншоты Winbox 4 [skip ci]" || echo "нечего коммитить"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && \
               git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            echo "попытка $i не удалась, ждём"; sleep 10
          done
          if [ "$ok" = 1 ]; then
            echo "снимки в ветке"
          else
            echo "push не удался после 4 попыток" >&2
            exit 1
          fi
